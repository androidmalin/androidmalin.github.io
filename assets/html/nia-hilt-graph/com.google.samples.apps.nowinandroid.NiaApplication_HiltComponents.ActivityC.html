    svg.has-active .edge:not(.active) {

      opacity: 0.3;
    }

    /* Dimmed edges stay clickable (to re-anchor the chain) but hovering them
       only nudges the opacity instead of lighting up like an active edge. */
    svg.has-active .edge:not(.active):hover {
      opacity: 0.55;
    }

    svg.has-active .edge:not(.active):hover path {
      stroke-width: 2.2;
      filter: none;
    }

    .edge.active {
      opacity: 1;
    }

    .edge.active path {
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 14 8;
      animation: flow 650ms linear infinite;
      filter: drop-shadow(0 0 5px currentColor);
    }

    .edge.active polygon {
      filter: drop-shadow(0 0 4px currentColor);
    }

    /* The clicked edge is the anchor of the chain: solid + pulsing so the eye
       can find where the chain was entered. Surrounding dashes flow into it
       (upstream callers) and out of it (downstream dependencies). */
    .edge.origin path {
      stroke-width: 6.5;
      stroke-dasharray: none;
      animation: pulse 1100ms ease-in-out infinite;
      filter: drop-shadow(0 0 7px currentColor);
    }

    .edge.origin polygon {
      filter: drop-shadow(0 0 6px currentColor);
    }

    @keyframes flow {
      to {
        stroke-dashoffset: -44;
      }
    }

    @keyframes pulse {

        filter: drop-shadow(0 0 3px currentColor);
      }

      }

  <script>
    const svg = document.querySelector("svg");
    const edges = Array.from(document.querySelectorAll(".edge"));
    const nodes = Array.from(document.querySelectorAll(".node"));
    const edgeRecords = [];
    const recordByEdge = new Map();
    const nodeByTitle = new Map();
    const incoming = new Map();
    const outgoing = new Map();

    nodes.forEach((node) => {
      const title = node.querySelector("title")?.textContent;
      if (title) {
        nodeByTitle.set(title, node);
      }
    });

    function addToMap(map, key, record) {
      const records = map.get(key) || [];
      records.push(record);
      map.set(key, records);
    }

    function edgeTitle(edge) {
      return edge.querySelector("title")?.textContent || edge.id || "edge";
    }

    function edgeRecord(edge) {
      const title = edgeTitle(edge);
      const separator = title.indexOf("->");
      if (separator === -1) {
        return null;
      }
      return {
        edge,
        title,
        src: title.slice(0, separator),
        dst: title.slice(separator + 2),
      };
    }

    // The full dependency chain through an edge: every transitive caller
    // upstream AND every transitive dependency downstream. Both sides are walked
    // completely and symmetrically, so the highlight is the whole connected
    // chain rather than "full one side, truncated the other". Each direction has
    // its own visited set, which both dedupes work and guards against cycles.
    function dependencyChain(record) {
      const selected = new Set([record.edge]);

      function walk(node, map, nextKey, visited) {
        (map.get(node) || []).forEach((step) => {
          if (visited.has(step)) {
            return;
          }
          visited.add(step);
          selected.add(step.edge);
          walk(step[nextKey], map, nextKey, visited);
        });
      }

      walk(record.src, incoming, "src", new Set()); // upstream: who depends on this
      walk(record.dst, outgoing, "dst", new Set()); // downstream: what this depends on

      return selected;
    }

    function clearActive() {
      edges.forEach((member) => member.classList.remove("active", "origin"));
      nodes.forEach((member) => member.classList.remove("active"));
    }

    edges.forEach((edge) => {
      const path = edge.querySelector("path");
      if (path) {
        edge.style.color = path.getAttribute("stroke") || "#0969da";
      }

      const title = edgeTitle(edge);
      edge.setAttribute("tabindex", "0");
      edge.setAttribute("role", "button");
      edge.setAttribute("aria-label", `Animate dependency chain containing ${title}`);

      const record = edgeRecord(edge);
      if (record) {
        edgeRecords.push(record);
        recordByEdge.set(edge, record);
        addToMap(outgoing, record.src, record);
        addToMap(incoming, record.dst, record);
      }

      edge.addEventListener("click", (event) => {
        event.stopPropagation();
        // Clicking the current anchor again clears it; clicking any other edge
        // re-anchors the chain onto it (even if it was part of the previous
        // highlight), so you can keep drilling along a chain one click at a time.
        const wasOrigin = edge.classList.contains("origin");
        clearActive();

        if (wasOrigin) {
          svg.classList.remove("has-active");
          return;
        }

        const chain = record ? dependencyChain(record) : new Set([edge]);
        const chainNodes = new Set();
        chain.forEach((member) => {
          member.classList.add("active");
          const memberRecord = recordByEdge.get(member);
          if (memberRecord) {
            chainNodes.add(memberRecord.src);
            chainNodes.add(memberRecord.dst);
          }
        });
        if (chainNodes.size === 0) {
          // Unparseable edge title: keep every node visible instead of dimming
          // the whole graph.
          nodes.forEach((member) => member.classList.add("active"));
        } else {
          chainNodes.forEach((id) => nodeByTitle.get(id)?.classList.add("active"));
        }
        edge.classList.add("origin");
        svg.classList.add("has-active");
      });

      edge.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          edge.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        }
      });
    });

    document.addEventListener("click", () => {
      clearActive();
      svg.classList.remove("has-active");
    });
  </script>
